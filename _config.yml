        # quote: >
        description: | # this will include new lines to allow paragraphs
          와이랩어스 Backend 개발 및 운영 <br>
          ##### <mark>와이랩어스(YLAB EARTH)</mark>

          [ITOMS](https://itoms.infofla.com) 솔루션 개발 및 코드 개선을 해나가고 있습니다. <br>
          ##### <mark>ITOMS</mark>: IT서비스 자동화 서비스 <br>
            - 부하 테스트로 Backend 코드 문제점 개선
            - Device Health Check 정보 수집을 위한 Agent 개발(Windows, Linux, Mac)
            - 수집된 Health Check 정보를 이용한 데이터 예측
            - 소프트웨어 품질인증(GS인증) 1등급 획득
            - 국가정보자원관리원 설치 및 운영 지원 <br><br>

          FLAS Streaming Backend, Transcoder 개발 <br>
          ##### <mark>FLAS</mark>: 아날로그 및 디지털 기록물을 관리하고 비디오, 오디오의 Streaming을 위한 Transcoding 플랫폼 <br>
            - ERD 설계
            - FFMPEG을 이용한 비디오, 오디오 Transcoding, Cataloging, Scene change, Thumbnail 개발
            - 몽골 국가기록원 설치 및 교육
            - NodeJs, Express, Graphql, MariaDB <br><br>

          Central Ave Backend 개발 <br>
          ##### <mark>Central Ave</mark>: 미국 PCAmerica의 POS기와 연동하여 Central Ave의 ERP와 어플리케이션을 제공하기 위한 서버 구축 <br>
            - 미국 LA에 네트워크 구성 및 서버 설치
            - NodeJs, Express, Graphql, MariaDB, MsSql <br><br>

          인터패스 IPERP Backend 개발 <br>
          ##### <mark>인터패스</mark>: 버스 단말기 AS를 위한 ERP 시스템 개발 <br><br>
            - NodeJs, Express, Graphql, MariaDB <br><br>

