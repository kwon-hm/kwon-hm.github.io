about_content: | # this will include new lines to allow paragraphs
  Node.js/GraphQL 기반의 7년 차 서버 백엔드 엔지니어입니다. <br>
  회사의 성장 단계마다 신규 프로젝트와 솔루션을 주도적으로 설계 및 구현했습니다. <br>
  사용자의 요구사항을 기반으로 ERD 설계부터 운영 환경 최적화까지 E2E로 수행하며, <br>
  프로젝트마다 요구사항 정의서, API 문서, 버그 리포트를 체계적으로 남겨 재발을 줄였습니다. <br>
  운영 단계에서는 부하 테스트로 병목을 제거하고, 반복 업무는 GitHub Actions로 자동화하여 배포 리드타임을 단축했습니다. <br>
  현재는 팀장으로서 주도적인 업무 환경을 만들고 팀원의 성장을 고려하며 개발을 진행하고 있습니다.

